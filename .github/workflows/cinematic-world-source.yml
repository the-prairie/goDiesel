name: Cinematic world source snapshot
on:
  push:
    branches: [codex/cinematic-world-replay]
    paths: [.github/workflows/cinematic-world-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked implementation sources only
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '-z', 'app', 'docs', 'AGENTS.md', 'CONTEXT.md', 'PRODUCT.md', 'STRATEGY.md', 'README.md']).decode().split('\0')
          suffixes = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.json', '.md', '.css', '.html', '.yml', '.yaml', '.toml', '.txt', '.svg'}
          with tarfile.open('cinematic-world-source.tar.gz', 'w:gz') as archive:
              for name in paths:
                  path = pathlib.Path(name)
                  if name and path.is_file() and not path.is_symlink() and (path.suffix in suffixes or path.name == '.gitignore'):
                      archive.add(path, arcname=name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-world-source
          path: cinematic-world-source.tar.gz
          retention-days: 1
