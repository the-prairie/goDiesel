name: Cinematic world implementation verification
on:
  push:
    branches: [codex/cinematic-world-replay]
    paths: [.github/workflows/cinematic-world-source.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'the-prairie/goDiesel' && github.ref == 'refs/heads/codex/cinematic-world-replay'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cinematic-world-replay
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize verified integration and npm lockfile on feature branch only
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p proof
          test "$(git hash-object .godiesel-cinematic-integration.patch)" = b7943b5c0a77634cf42fe78d3d6065f6f37f580c
          git apply --check .godiesel-cinematic-integration.patch
          git apply .godiesel-cinematic-integration.patch
          cd app
          npm install --save-exact --no-audit --no-fund three@0.185.1 3d-tiles-renderer@0.5.2 three-mesh-bvh@0.9.11 postprocessing@6.39.4 @takram/three-atmosphere@0.19.1 @takram/three-clouds@0.7.6 @takram/three-geospatial@0.9.1
          npm install --save-dev --save-exact --no-audit --no-fund @types/three@0.185.0
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('package.json')
          data = json.loads(p.read_text())
          data['scripts']['test:e2e:cinematic-live'] = 'playwright test --config playwright.cinematic-live.config.ts'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          cd ..
          python3 - <<'PY'
          import subprocess
          expected = {
            'app/e2e/cinematic-world-live.spec.ts':'83bc6964025a7f5ddc898805579044ea61c2797e',
            'app/e2e/cinematic-world-renderer.spec.ts':'5c834e49beaf1ae4bf7dbcdde891052453189e8d',
            'app/e2e/cinematic-world.spec.ts':'1d07262d13b36a7a23b74e48ac754e1057cce888',
            'app/e2e/helpers/cinematic-fixture.ts':'6a657057887d88cb100e7751258f1a41798fd818',
            'app/package-lock.json':'240682ed90c233f3f04a7cacc9869017e454d752',
            'app/package.json':'86bd9b8e8afad98c96b1446f8739ac3de2d50fa5',
            'app/playwright.cinematic-live.config.ts':'9e4f5ef2feddd2a217f49be0440f6fee9ed5457c',
            'app/src/surfaces/replay/components/google-route-navigator-stage.tsx':'9dc2eb820109329650866f540ad5bb47643c8d7e',
            'app/src/surfaces/replay/components/replay-route-picker.tsx':'db10fa0b4d84682a0de572f84768bf6d27de643e',
            'app/src/surfaces/replay/replay-page.tsx':'7e73c14c6d2b38852aa4d0f19c121c9b557c438b',
            'app/src/surfaces/replay/world/cinematic-world-engine.ts':'2dd0cf56b1ce6a4cb874561fb31689284c764eec',
            'app/src/surfaces/replay/world/mvt-types.d.ts':'9fdb3206300b67745c4a3122e132f43e8a8569fd',
            'app/src/surfaces/replay/world/world-atmosphere.ts':'05a3e00b22722ccf2515436c6b87005f52afba71',
            'app/src/surfaces/replay/world/world-controls.tsx':'54245abe7a872793d532588de55aa0a0cf034ea8',
            'app/src/surfaces/replay/world/world-frame.ts':'3a37ce542a5800852abe53734d20e250be7d0e16',
            'app/src/surfaces/replay/world/world-labels.ts':'992f951b0ca028649cd2a354bc9d685a9305e016',
            'app/src/surfaces/replay/world/world-model.test.ts':'f5fa69e35246a6809977601a4c84b1f252f52fc3',
            'app/src/surfaces/replay/world/world-model.ts':'a19a88697f4a84a9d2f2a7cd0f58992db7086b85',
            'app/src/surfaces/replay/world/world-route.ts':'2395424c57ce846fed031643e8cd0bb0a6da96e0',
            'app/vite.config.ts':'7660c80af90d54816ef9a32ff90d22eb39b5ca8e',
            'docs/architecture/cinematic-world-replay.md':'b0cea9ff040e49c71e126ea854e49810cc708400',
          }
          for name, expected_hash in expected.items():
              actual = subprocess.check_output(['git','hash-object',name], text=True).strip()
              assert actual == expected_hash, (name, actual, expected_hash)
          print('All 21 materialized files match the locally typechecked implementation.')
          PY
          git rm .godiesel-cinematic-integration.patch
          git diff --check
          git add app/package.json app/package-lock.json app/vite.config.ts app/src/surfaces/replay
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate cinematic world into Replay with pinned rendering dependencies'
          git push origin HEAD:refs/heads/codex/cinematic-world-replay
          git rev-parse HEAD | tee proof/commit.txt
          git status --short | tee proof/dirty-state.txt
      - name: Ticket gate
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        working-directory: app
        run: npm run verify:ticket 2>&1 | tee ../proof/ticket.txt
      - name: Browser and real shader pipeline verification
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/cinematic-world.spec.ts e2e/cinematic-world-renderer.spec.ts e2e/google-replay-production.spec.ts --project=chromium 2>&1 | tee ../proof/browser.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-world-verification
          path: |
            proof/
            app/test-results/
          retention-days: 7
