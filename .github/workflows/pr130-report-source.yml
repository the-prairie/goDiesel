name: Export PR 130 report source
on:
  push:
    branches: [codex/pr130-refinement-inspection]
    paths: [.github/workflows/pr130-report-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 237006bc0face615b8f0214c030a31e2de3e66bf
          fetch-depth: 0
          persist-credentials: false
      - name: Export changed tracked source and identity
        shell: bash
        run: |
          mkdir -p /tmp/pr130-report-source
          git rev-parse HEAD > /tmp/pr130-report-source/commit.txt
          git ls-files -s > /tmp/pr130-report-source/files.txt
          git diff --name-only --diff-filter=ACMRT -z af5ff4ab9b0fc53dfcdf8f2e347cd0a4b734e53b HEAD | tar --null -T - -czf /tmp/pr130-report-source/delta.tar.gz
          git diff --name-only --diff-filter=D af5ff4ab9b0fc53dfcdf8f2e347cd0a4b734e53b HEAD > /tmp/pr130-report-source/deleted.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr130-report-source
          path: /tmp/pr130-report-source
          retention-days: 3
