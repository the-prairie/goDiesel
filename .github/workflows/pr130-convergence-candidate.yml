name: Validate Replay convergence candidate
on:
  push:
    branches: [codex/pr130-refinement-inspection]
    paths: [.github/workflows/pr130-convergence-candidate.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b1e00881f25cd9baf27c794ceb017c59ff9e7ea6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact candidate patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/base-commit.txt
          python - <<'PY'
          import os,json,base64,gzip,hashlib,urllib.request,pathlib,subprocess
          paths=set()
          for i,(sha,digest,compressed) in enumerate([
            ('d0f6be121f256bd610e3ba8fb1a43e693febae91','1e1eb07dfd8e45bb80b40ada72379387b2824d84a160bc1d2ce8e000bba2aaee',False),
            ('64c56bfef24e2fc872ac491174ab85a2232c89f0','e0dd403ea76ca01b5500e128fc25ed4918ac202e79b13d1db14de253f2854cc8',False),
            ('908555d3424d073b3b7287e0d614a2d1d5fe419b','37b52f96751def304e7fa7802aa2a7dec9cdba990d7d6a5c008985f4a82420e5',True),
            ('ab8b232629b475491bf6ada330dea4c396279358','f8dd51f38f5422f6ecae9075b8e1035fc4c107f206c0cd1a29b58d283ada7e47',False),
            ('bdfe6105f22fb2b99899e1df2a20dab00daf5b3b','7723b23d64de737a6e42116a4e519afe126ad11ad33716645883bd03f524d8f9',False),
            ('d66c3bb728909a968c74b5d52fcb02798885bf5f','a5cf41880700df51d901dfa0d471f09ba2da42c7694c1c793b392b5b7a8a0829',False)]):
              request=urllib.request.Request('https://api.github.com/repos/the-prairie/goDiesel/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              patch=base64.b64decode(json.load(urllib.request.urlopen(request))['content'])
              if sha=='d66c3bb728909a968c74b5d52fcb02798885bf5f': patch=gzip.decompress(patch)
              elif compressed: patch=gzip.decompress(base64.b64decode(patch))
              assert hashlib.sha256(patch).hexdigest()==digest
              file='proof/candidate-'+str(i)+'.patch'
              pathlib.Path(file).write_bytes(patch)
              subprocess.run(['git','apply','--check',file],check=True)
              subprocess.run(['git','apply',file],check=True)
              paths.update(line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/'))
          pathlib.Path('proof/paths.json').write_text(json.dumps(sorted(paths)))
          PY
      - run: npm ci --prefix app
      - name: Typecheck and unit tests
        working-directory: app
        run: |
          npm run typecheck 2>&1 | tee ../proof/typecheck.txt
          npm run test:unit 2>&1 | tee ../proof/unit.txt
          node --test scripts/replay-verification-receipt.test.mjs 2>&1 | tee ../proof/receipt-tests.txt
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Exercise actual renderer handoff and camera clearance
        working-directory: app
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ../proof/browser-results.json
        run: npx playwright test e2e/cinematic-world-prepared.spec.ts e2e/cinematic-world-surface.spec.ts --project=chromium --reporter=line,json 2>&1 | tee ../proof/browser.txt
      - name: Create exact validated source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,pathlib,hashlib
          entries=[]
          for path in json.loads(pathlib.Path('proof/paths.json').read_text()):
              raw=pathlib.Path(path).read_bytes()
              request=urllib.request.Request('https://api.github.com/repos/the-prairie/goDiesel/git/blobs',data=json.dumps({'content':raw.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              result=json.load(urllib.request.urlopen(request))
              assert result['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':result['sha']})
          pathlib.Path('proof/source-blobs.json').write_text(json.dumps(entries,indent=2))
          PY
      - name: Build authorized local live-provider candidate
        working-directory: app
        env:
          VITE_WORLD_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_WORLD_GOOGLE_MAPS_API_KEY }}
        run: |
          test -n "$VITE_WORLD_GOOGLE_MAPS_API_KEY"
          npm run build 2>&1 | tee ../proof/live-build.txt
      - name: Inspect independent live checkpoints without external deployment
        working-directory: app
        env:
          GODIESEL_WORLD_PREVIEW_URL: http://localhost:8788
          PLAYWRIGHT_JSON_OUTPUT_FILE: ../proof/live-results.json
        run: |
          npx vite preview --host 0.0.0.0 --port 8788 > /tmp/replay-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://localhost:8788/ > /dev/null && break || sleep 1; done
          npm run test:e2e:cinematic-live -- --reporter=line,json 2>&1 | tee ../proof/live-provider.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-convergence-candidate
          path: |
            proof/
            app/test-results/
          retention-days: 3
