name: PR 130 live refinement diagnosis
on:
  push:
    branches: [codex/pr130-refinement-inspection]
    paths: [.github/workflows/pr130-live-inspection.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: af5ff4ab9b0fc53dfcdf8f2e347cd0a4b734e53b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: cd app && npx playwright install --with-deps chromium
      - name: Bounded live experiments (not acceptance)
        working-directory: app
        run: |
          mkdir -p ../inspection
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { writeFileSync } from 'node:fs';
          const target = 'https://bf612f03.godiesel.pages.dev';
          const report = { target, source: '0df0edbecf484fab9314ab4152652b5aebc162df', synthetic: false, diagnosticOnly: true, cases: [] };
          const browser = await chromium.launch({ headless: true });
          try {
            for (const slug of ['17665674778']) {
              const page = await browser.newPage({ viewport: { width: 1280, height: 720 }, serviceWorkers: 'block' });
              const result = { slug, responses: {}, samples: [], errors: [] }; report.cases.push(result);
              page.on('console',msg=>{if(msg.type()==='error')result.errors.push(msg.text().replace(/https?:\/\/\S+/g,'[URL]').replace(/AIza[\w-]+/g,'[redacted]').slice(0,500));});
              page.on('response', response => { const url = new URL(response.url()); if (url.hostname === 'tile.googleapis.com' || url.pathname.endsWith('.pbf') || url.pathname.includes('draco')) { const key = `${url.hostname}/${response.status()}/${url.pathname.endsWith('.glb') ? 'model' : url.pathname.endsWith('.pbf') ? 'vector' : url.pathname.includes('draco') ? 'decoder' : 'metadata'}`; result.responses[key] = (result.responses[key] || 0) + 1; } });
              await page.goto(`${target}/#/replay/${slug}?renderer=cinematic`);
              const probe = async (mode) => page.evaluate((mode) => {
                const stage = document.querySelector('[data-testid="replay-stage"]');
                let fiber = stage?.[Object.keys(stage).find(k => k.startsWith('__reactFiber'))];
                let e;
                for (let i=0; fiber && i<30 && !e; i++, fiber=fiber.return) {
                  for(let h=fiber.memoizedState,j=0; h && j<100; j++,h=h.next) { const x=h.memoizedState?.current; if(x?.tiles && x?.camera) {e=x;break;} }
                }
                if (!e) return { mode, found: false, world: {...document.querySelector('[data-world-terrain]')?.dataset} };
                const t=e.tiles, p=t.getPluginByName('MVT_ANNOTATIONS_PLUGIN'), cache=t.lruCache;
                const queue = q => ({running:q?.currJobs,waiting:q?.items?.length,max:q?.maxJobs});
                const visible=[]; t.forEachLoadedModel((scene,tile)=>{if(t.visibleTiles.has(tile)&&visible.length<12)visible.push({depth:tile.internal.depth,error:tile.geometricError,sse:tile.traversal.error});});
                const draco=t.plugins.find(p=>p.dracoLoader)?.dracoLoader;
                const data = { mode, time:performance.now(), world:{...document.querySelector('[data-world-terrain]')?.dataset}, stats:{...t.stats}, progress:t.loadProgress, queues:{parse:queue(t.parseQueue),download:queue(t.downloadQueue)}, decoder:draco?{tasks:draco.workerNextTaskID,workers:draco.workerPool.map(w=>({load:w._taskLoad,pending:Object.keys(w._callbacks).length}))}:null, cacheBytes:cache.cachedBytes, visible, labels:p?{vectors:p.vectorTileInfo.size,keys:[...p.vectorTileInfo.keys()].slice(-20),points:p.pointManager.points.size,lines:p.anchorManager.lines.size,visible:p.occupancy.visible.size}:null };
                if(mode==='disable-atmosphere') {e.atmosphereReady=false;e.renderer.toneMapping=4;}
                if(mode==='skip-ancestors') {t.loadAncestors=false;t.loadSiblings=false;}
                if(mode==='local-frustum') {e.camera.far=20000;e.camera.updateProjectionMatrix();e.pose=undefined;}
                return data;
              }, mode);
              await page.waitForTimeout(12000);
              const chase=page.getByRole('button',{name:'Chase',exact:true}); if(await chase.isEnabled()) await chase.click();
              await page.waitForTimeout(8000);
              for(const mode of ['disable-atmosphere','skip-ancestors','local-frustum','final']) {
                result.samples.push(await probe(mode));
                await page.screenshot({path:`../inspection/${slug}-${mode}.png`});
                writeFileSync('../inspection/diagnosis.json',JSON.stringify(report,null,2));
                if(mode!=='final')await page.waitForTimeout(12000);
              }
              await page.close();
            }
          } finally { await browser.close(); writeFileSync('../inspection/diagnosis.json',JSON.stringify(report,null,2)); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr130-refinement-diagnosis
          path: inspection/
          retention-days: 3
