name: Verify cinematic world
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-cinematic-world.yml'
      - 'app/src/surfaces/replay/**'
      - 'app/e2e/cinematic-world*'
      - 'app/e2e/helpers/cinematic-fixture.ts'
      - 'app/package*.json'
      - 'app/vite.config.ts'
permissions:
  contents: read
concurrency:
  group: cinematic-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    # Explicit bash enables -eo pipefail: tee must never hide a failed gate.
    shell: bash
jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Capture source and runner
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/commit.txt
          git status --short > proof/dirty-state.txt
          node --version > proof/node.txt
      - name: Install dependencies
        run: npm ci --prefix app
      - name: Typecheck and all unit tests
        working-directory: app
        run: |
          npx tsc -b 2>&1 | tee ../proof/typecheck.txt
          npm run test:unit 2>&1 | tee ../proof/unit.txt
      - name: Install browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Production build, controls and real shader pipeline
        working-directory: app
        run: |
          npx playwright test e2e/cinematic-world.spec.ts e2e/cinematic-world-renderer.spec.ts e2e/google-replay-production.spec.ts --project=chromium 2>&1 | tee ../proof/browser.txt
      - name: Live Google Map Tiles provider proof
        working-directory: app
        env:
          VITE_WORLD_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_WORLD_GOOGLE_MAPS_API_KEY }}
          GODIESEL_WORLD_PREVIEW_URL: http://localhost:8788
        run: |
          if [[ -z "$VITE_WORLD_GOOGLE_MAPS_API_KEY" ]]; then
            echo 'BLOCKED: VITE_WORLD_GOOGLE_MAPS_API_KEY repository secret is unavailable.' | tee ../proof/live-provider.txt
            exit 1
          fi
          npm run build 2>&1 | tee ../proof/live-build.txt
          npm run preview > ../proof/live-preview.txt 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:8788/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo 'BLOCKED: local live-key preview did not become ready.' | tee ../proof/live-provider.txt
              exit 1
            fi
            sleep 1
          done
          xvfb-run -a npm run test:e2e:cinematic-live 2>&1 | tee ../proof/live-provider.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-world-proof
          path: |
            proof/
            app/test-results/
          retention-days: 7
