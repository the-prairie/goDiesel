name: Verify cinematic world
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-cinematic-world.yml'
      - 'app/src/surfaces/replay/**'
      - 'app/e2e/cinematic-world*'
      - 'app/e2e/helpers/cinematic-fixture.ts'
      - 'app/package*.json'
      - 'app/vite.config.ts'
permissions:
  contents: read
concurrency:
  group: cinematic-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    # Explicit bash enables -eo pipefail: tee must never hide a failed gate.
    shell: bash
jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Capture source and runner
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/commit.txt
          git status --short > proof/dirty-state.txt
          node --version > proof/node.txt
      - name: Install dependencies
        run: npm ci --prefix app
      - name: Typecheck and all unit tests
        working-directory: app
        run: |
          npx tsc -b 2>&1 | tee ../proof/typecheck.txt
          npm run test:unit 2>&1 | tee ../proof/unit.txt
      - name: Install browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Production build, controls and real shader pipeline
        working-directory: app
        run: |
          npx playwright test e2e/cinematic-world.spec.ts e2e/cinematic-world-renderer.spec.ts e2e/google-replay-production.spec.ts --project=chromium 2>&1 | tee ../proof/browser.txt
      - name: Build live-key PR preview
        if: ${{ always() }}
        working-directory: app
        env:
          VITE_WORLD_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_WORLD_GOOGLE_MAPS_API_KEY }}
        run: |
          if [[ -z "$VITE_WORLD_GOOGLE_MAPS_API_KEY" ]]; then
            echo 'BLOCKED: VITE_WORLD_GOOGLE_MAPS_API_KEY repository secret is unavailable.' | tee ../proof/live-provider.txt
            exit 1
          fi
          npm run build 2>&1 | tee ../proof/live-build.txt
      - name: Deploy PR preview to Cloudflare Pages
        if: ${{ always() }}
        id: cloudflare
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'BLOCKED: Cloudflare Pages deployment secrets are unavailable.' | tee ../proof/cloudflare-deploy.txt
            exit 1
          fi
          if [[ ! -d dist ]]; then
            echo 'BLOCKED: live-key preview build did not produce app/dist.' | tee ../proof/cloudflare-deploy.txt
            exit 1
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name=godiesel \
            --branch="${GITHUB_HEAD_REF:-codex/cinematic-world-replay}" \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-message="PR #${{ github.event.pull_request.number }} cinematic world preview" \
            2>&1 | tee ../proof/cloudflare-deploy.txt
          preview_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' ../proof/cloudflare-deploy.txt | tail -1)
          if [[ -z "$preview_url" ]]; then
            echo 'BLOCKED: Cloudflare deploy succeeded without a parseable preview URL.' | tee -a ../proof/cloudflare-deploy.txt
            exit 1
          fi
          echo "$preview_url" | tee ../proof/cloudflare-preview-url.txt
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Live Google Map Tiles proof on deployed preview
        if: ${{ always() && steps.cloudflare.outcome == 'success' }}
        working-directory: app
        env:
          GODIESEL_WORLD_PREVIEW_URL: ${{ steps.cloudflare.outputs.preview_url }}
        run: |
          echo "Testing $GODIESEL_WORLD_PREVIEW_URL" | tee ../proof/live-provider.txt
          npm run test:e2e:cinematic-live 2>&1 | tee -a ../proof/live-provider.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-world-proof
          path: |
            proof/
            app/test-results/
          retention-days: 7
