name: Verify deployment branch safety

on:
  push:
    branches:
      - chore/deploy-production-branch-safety
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install application dependencies
        run: npm ci --prefix app

      - name: Install Playwright Chromium
        run: cd app && npx playwright install --with-deps chromium

      - name: Deterministic public Python tests
        run: >-
          .venv/bin/python -m pytest -q
          --ignore=test_pipeline_verification.py
          --ignore=test_curation_publish.py

      - name: Deployment command regression
        run: .venv/bin/python -m pytest -q test_deployment_command.py

      - name: Test the inverse synthetic pinch direction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/e2e/atlas.spec.ts")
          source = path.read_text(encoding="utf-8")
          outward_start = '''    await client.send("Input.dispatchTouchEvent", {
              type: "touchStart",
              touchPoints: [
                { x: centerX - 45, y: centerY, id: 11 },
                { x: centerX + 45, y: centerY, id: 12 },
              ],
            });'''
          inward_start = outward_start.replace("- 45", "- 100").replace("+ 45", "+ 100")
          outward_move = '''    await client.send("Input.dispatchTouchEvent", {
              type: "touchMove",
              touchPoints: [
                { x: centerX - 100, y: centerY, id: 11 },
                { x: centerX + 100, y: centerY, id: 12 },
              ],
            });'''
          inward_move = outward_move.replace("- 100", "- 45").replace("+ 100", "+ 45")
          if outward_start not in source or outward_move not in source:
              raise SystemExit("expected pinch fixture was not found")
          path.write_text(
              source.replace(outward_start, inward_start, 1).replace(outward_move, inward_move, 1),
              encoding="utf-8",
          )
          PY
          cd app
          npx playwright test e2e/atlas.spec.ts \
            --project=chromium-pinch \
            --grep "mobile globe supports two-finger pinch without losing region state" \
            --repeat-each=5

      - name: JavaScript release gate
        run: npm --prefix app run verify

      - name: Build canonical deployment output
        run: ./make-dist.sh

      - name: Shell and diff hygiene
        shell: bash
        run: |
          bash -n make-dist.sh
          git diff --check origin/main...HEAD
