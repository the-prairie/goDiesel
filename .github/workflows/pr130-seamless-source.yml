name: Validate Seamless Replay candidate
on:
  push:
    branches: [codex/pr130-refinement-inspection]
    paths: [.github/workflows/pr130-seamless-source.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a104f3a56812111733a2b4679805e54d4157ac1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply exact source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p proof
          git rev-parse HEAD > proof/commit.txt
          python - <<'PY'
          import os,json,base64,gzip,hashlib,urllib.request,pathlib,subprocess
          shas=['42405ff9b26cf60cb4fe0be79dfb052ca959fd8f','93f1ae1751f07c216817eb8b0ec44428d84d5751']
          fixes=[[[6175,6176,''],[6373,6374,''],[7151,7152,''],[16986,16988,'V']],[[2342,3831,''],[3855,3857,''],[18475,18476,'']]]
          parts=[]
          for i,sha in enumerate(shas):
              req=urllib.request.Request('https://api.github.com/repos/the-prairie/goDiesel/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              text=base64.b64encode(base64.b64decode(json.load(urllib.request.urlopen(req))['content'])).decode()
              for start,end,replacement in reversed(fixes[i]): text=text[:start]+replacement+text[end:]
              parts.append(base64.b64decode(text))
          data=b''.join(parts)
          assert hashlib.sha256(data).hexdigest()=='938b32fce972c50685223884c572aedca7ba569232d9247ee40f58a6afd82f05'
          patch=gzip.decompress(data)
          pathlib.Path('proof/candidate.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','proof/candidate.patch'],check=True)
          subprocess.run(['git','apply','proof/candidate.patch'],check=True)
          paths=[line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')]
          pathlib.Path('proof/paths.json').write_text(json.dumps(paths))
          p=pathlib.Path('app/e2e/cinematic-world-prepared.spec.ts')
          old='    await page.getByRole("button",{name:"Chase",exact:true}).click();'
          new='    await page.getByRole("button",{name:"Replay settings",exact:true}).click();\n'+old+'\n    await page.getByRole("button",{name:"Replay settings",exact:true}).click();'
          text=p.read_text();assert text.count(old)==1;p.write_text(text.replace(old,new))
          PY
      - run: npm ci --prefix app
      - name: Typecheck and all unit tests
        working-directory: app
        run: |
          npm run typecheck 2>&1 | tee ../proof/typecheck.txt
          npm run test:unit 2>&1 | tee ../proof/unit.txt
          node --test scripts/replay-verification-receipt.test.mjs 2>&1 | tee ../proof/receipt-tests.txt
      - name: Install browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Verify prepared destination and camera support in the actual renderer
        working-directory: app
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ../proof/browser-results.json
        run: npx playwright test e2e/cinematic-world-prepared.spec.ts e2e/cinematic-world-surface.spec.ts e2e/cinematic-world-report.spec.ts --grep 'real prepared destination|cancelled cold|coarse terrain|real controls' --project=chromium --reporter=line,json 2>&1 | tee ../proof/browser.txt
      - name: Create verified source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,pathlib
          entries=[]
          for path in json.loads(pathlib.Path('proof/paths.json').read_text()):
              content=pathlib.Path(path).read_text()
              req=urllib.request.Request('https://api.github.com/repos/the-prairie/goDiesel/git/blobs',data=json.dumps({'content':content,'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              result=json.load(urllib.request.urlopen(req))
              entries.append({'path':path,'mode':'100644','type':'blob','sha':result['sha']})
          pathlib.Path('proof/source-blobs.json').write_text(json.dumps(entries,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seamless-replay-candidate
          path: |
            proof/
            app/test-results/
          retention-days: 3
