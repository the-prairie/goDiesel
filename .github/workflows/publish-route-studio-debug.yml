name: Publish applied Route Studio debug branch

on:
  pull_request:
    branches:
      - feat/route-studio
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Reconstruct and apply exact remediation
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path('.route-studio-patch').glob('part-*.b64'))
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 patch parts, found {len(parts)}')
          encoded = ''.join(path.read_text(encoding='utf-8') for path in parts)
          Path('/tmp/remediation.patch.gz').write_bytes(base64.b64decode(encoded))
          PY
          gzip -dc /tmp/remediation.patch.gz > /tmp/remediation.patch
          echo 'e786acb10c03a0128562bb16871d7bcdf3a94743a4e9421f53535c9ccfe21e3a  /tmp/remediation.patch' | sha256sum -c -
          git apply --3way --index /tmp/remediation.patch
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('app/src/surfaces/admin/components/route-studio-workspace.tsx')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''          const visual =\n.*?          return \(\n            <li\n              key=\{step\.label\}\n              \{\.\.\.attribute\}''',
              re.DOTALL,
          )
          replacement = '''          const current = index === currentIndex;
          const tone =
            index < currentIndex
              ? "complete"
              : current
                ? "current"
                : "upcoming";
          return (
            <li
              key={step.label}
              aria-current={current ? "step" : undefined}'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not apply Route Studio stepper parser fix')
          text = text.replace('data-tone={visual.tone}', 'data-tone={tone}')
          path.write_text(text, encoding='utf-8')
          PY
          rm -rf .route-studio-patch
          rm -f .github/workflows/apply-route-studio-remediation.yml
          rm -f .github/workflows/publish-route-studio-debug.yml
          git add -A

      - name: Publish exact applied source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'debug: publish applied Route Studio remediation [skip ci]'
          git push --force origin HEAD:tmp-route-studio-applied-debug
