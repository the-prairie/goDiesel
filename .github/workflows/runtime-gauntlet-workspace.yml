name: Runtime gauntlet workspace

on:
  push:
    branches:
      - perf/runtime-performance-gauntlet
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  package:
    if: github.head_ref == 'perf/runtime-performance-gauntlet' || github.ref_name == 'perf/runtime-performance-gauntlet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package the exact branch workspace
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=app/node_modules \
            --exclude=app/dist \
            --exclude=app/test-results \
            --exclude=app/playwright-report \
            -czf godiesel-runtime-gauntlet-workspace.tar.gz .

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: godiesel-runtime-gauntlet-workspace
          path: godiesel-runtime-gauntlet-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
