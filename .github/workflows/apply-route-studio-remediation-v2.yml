name: Apply Route Studio remediation v2

on:
  pull_request:
    branches:
      - feat/route-studio
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Reconstruct and apply exact remediation
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path('.route-studio-patch').glob('part-*.b64'))
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 patch parts, found {len(parts)}')
          encoded = ''.join(path.read_text(encoding='utf-8') for path in parts)
          Path('/tmp/remediation.patch.gz').write_bytes(base64.b64decode(encoded))
          PY
          gzip -dc /tmp/remediation.patch.gz > /tmp/remediation.patch
          echo 'e786acb10c03a0128562bb16871d7bcdf3a94743a4e9421f53535c9ccfe21e3a  /tmp/remediation.patch' | shasum -a 256 -c -
          git apply --3way --index /tmp/remediation.patch

      - name: Apply parser and integration fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workspace = Path('app/src/surfaces/admin/components/route-studio-workspace.tsx')
          text = workspace.read_text(encoding='utf-8')
          stepper = re.compile(
              r'''          const visual =\n.*?          return \(\n            <li\n              key=\{step\.label\}\n              \{\.\.\.attribute\}''',
              re.DOTALL,
          )
          replacement = '''          const current = index === currentIndex;
          const tone =
            index < currentIndex
              ? "complete"
              : current
                ? "current"
                : "upcoming";
          return (
            <li
              key={step.label}
              aria-current={current ? "step" : undefined}'''
          text, count = stepper.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not apply Route Studio stepper parser fix')
          text = text.replace('data-tone={visual.tone}', 'data-tone={tone}')

          optional_candidate = re.compile(
              r'(function\s+([A-Z]\w*)\([\s\S]*?candidate\?:\s*StudioCandidate[\s\S]*?\)\s*\{)'
          )
          pieces = []
          last = 0
          guard_count = 0
          for match in optional_candidate.finditer(text):
              if 'if (!candidate)' in text[match.end():match.end() + 260]:
                  continue
              pieces.append(text[last:match.end()])
              pieces.append('''
  if (!candidate) {
    return (
      <div className="grid min-h-52 place-items-center border-y border-line bg-surface-muted px-5 text-sm text-ink-muted">
        No route geometry selected
      </div>
    );
  }''')
              last = match.end()
              guard_count += 1
          if guard_count:
              pieces.append(text[last:])
              text = ''.join(pieces)
          workspace.write_text(text, encoding='utf-8')

          repository = Path('app/src/data/owner-route-repository.ts')
          text = repository.read_text(encoding='utf-8')
          needle = 'export function ownerRouteSummary'
          starts = [match.start() for match in re.finditer(re.escape(needle), text)]
          while len(starts) > 1:
              start = starts[0]
              next_export = text.find('\nexport ', start + len(needle))
              if next_export < 0:
                  raise SystemExit('Could not isolate duplicate ownerRouteSummary')
              text = text[:start] + text[next_export + 1:]
              starts = [match.start() for match in re.finditer(re.escape(needle), text)]
          repository.write_text(text, encoding='utf-8')
          PY

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Install Playwright browser
        run: cd app && npx playwright install chromium

      - name: Resolve stale typed fixtures and verify TypeScript
        shell: bash
        run: |
          cat > /tmp/fix_typecheck.py <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import json
          import re
          import subprocess

          ROOT = Path.cwd()
          ERROR_RE = re.compile(r'(.+?)\((\d+),(\d+)\): error (TS\d+): (.+)')

          def run_typecheck():
              result = subprocess.run(
                  ['npm', '--prefix', 'app', 'run', 'typecheck'],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              Path('/tmp/typecheck.log').write_text(result.stdout, encoding='utf-8')
              errors = []
              for line in result.stdout.splitlines():
                  match = ERROR_RE.match(line)
                  if match:
                      errors.append({
                          'file': match.group(1),
                          'line': int(match.group(2)),
                          'column': int(match.group(3)),
                          'code': match.group(4),
                          'message': match.group(5),
                      })
              return result.returncode, errors

          def object_range(text: str, target: int):
              stack = []
              ranges = []
              quote = None
              escaped = False
              for index, char in enumerate(text):
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in ('"', "'", '`'):
                      quote = char
                  elif char == '{':
                      stack.append(index)
                  elif char == '}' and stack:
                      start = stack.pop()
                      if start <= target <= index:
                          ranges.append((start, index))
              for start, end in sorted(ranges, key=lambda value: value[1] - value[0]):
                  prefix = text[max(0, start - 80):start].rstrip()
                  if re.search(
                      r'(function\s+\w+\([^)]*\)|if\s*\([^)]*\)|for\s*\([^)]*\)|while\s*\([^)]*\)|switch\s*\([^)]*\)|catch\s*\([^)]*\)|=>)$',
                      prefix,
                  ):
                      continue
                  return start, end
              return None

          def add_missing_property(path: Path, line_number: int, name: str, value: str):
              text = path.read_text(encoding='utf-8')
              offsets = []
              position = 0
              for line in text.splitlines(keepends=True):
                  offsets.append(position)
                  position += len(line)
              target = offsets[max(0, min(line_number - 1, len(offsets) - 1))]
              selected = object_range(text, target)
              if not selected:
                  return False
              start, end = selected
              if re.search(rf'\b{re.escape(name)}\s*:', text[start:end]):
                  return False
              line_start = text.rfind('\n', 0, end) + 1
              indent = re.match(r'[ \t]*', text[line_start:end]).group(0)
              text = text[:end] + f'\n{indent}  {name}: {value},' + text[end:]
              path.write_text(text, encoding='utf-8')
              return True

          for _ in range(6):
              return_code, errors = run_typecheck()
              if return_code == 0:
                  break
              changed = False
              for error in errors:
                  path = ROOT / error['file']
                  if not path.exists():
                      continue
                  message = error['message']
                  missing = re.search(r"Property '([^']+)' is missing", message)
                  if missing and missing.group(1) in {'health', 'routes', 'events', 'errors', 'artifacts'}:
                      changed |= add_missing_property(
                          path,
                          error['line'],
                          missing.group(1),
                          '[]',
                      )
                      continue
                  if "Property 'map' does not exist on type 'OwnerRouteReadModel'" in message:
                      text = path.read_text(encoding='utf-8')
                      lines = text.splitlines(keepends=True)
                      index = error['line'] - 1
                      lines[index] = lines[index].replace('.map(', '.routes.map(')
                      path.write_text(''.join(lines), encoding='utf-8')
                      changed = True
                  elif "Property 'length' does not exist on type 'OwnerRouteReadModel'" in message:
                      text = path.read_text(encoding='utf-8')
                      lines = text.splitlines(keepends=True)
                      index = error['line'] - 1
                      lines[index] = lines[index].replace('.length', '.routes.length')
                      path.write_text(''.join(lines), encoding='utf-8')
                      changed = True
                  elif "Property 'find' does not exist on type 'OwnerRouteReadModel'" in message:
                      text = path.read_text(encoding='utf-8')
                      lines = text.splitlines(keepends=True)
                      index = error['line'] - 1
                      lines[index] = lines[index].replace('.find(', '.routes.find(')
                      path.write_text(''.join(lines), encoding='utf-8')
                      changed = True
              if not changed:
                  print(Path('/tmp/typecheck.log').read_text(encoding='utf-8'))
                  raise SystemExit('TypeScript errors remain outside the expected compatibility fixes')
          else:
              raise SystemExit('TypeScript compatibility fixes did not converge')

          return_code, errors = run_typecheck()
          if return_code != 0:
              print(Path('/tmp/typecheck.log').read_text(encoding='utf-8'))
              raise SystemExit('TypeScript verification failed after compatibility fixes')
          PY
          python3 /tmp/fix_typecheck.py

      - name: Focused Python verification
        shell: bash
        run: .venv/bin/python -m pytest -q test_route_imports.py test_route_studio.py

      - name: Unit tests
        run: npm --prefix app run test:unit

      - name: Focused browser verification
        shell: bash
        run: |
          cd app
          npx playwright test \
            e2e/route-studio.spec.ts \
            e2e/owner-route-read-model.spec.ts \
            e2e/routes-library.spec.ts \
            e2e/finder-planning.spec.ts

      - name: Diff hygiene
        run: git diff --check

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: route-studio-remediation-diagnostics
          path: |
            /tmp/typecheck.log
            app/test-results
            app/playwright-report
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit verified remediation
        if: success()
        shell: bash
        run: |
          rm -rf .route-studio-patch
          rm -f .github/workflows/apply-route-studio-remediation.yml
          rm -f .github/workflows/apply-route-studio-remediation-v2.yml
          rm -f .github/workflows/publish-route-studio-debug.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(studio): complete source health and field-guide migration'
          git push origin HEAD:tmp-route-studio-apply-work
