name: Verify

# Deterministic, provider-free verification for every pull request and every
# push to main. It needs no secrets and deploys nothing. Live-provider gates and
# the real-data pipeline proof stay manual (docs/agents/testing.md, ADR-0012).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request supersedes the running check. On main every
  # commit keeps its verdict; only a queued, not-yet-started run is replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Several Python tests drive the real `node` binary.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # test_route_video.py reads and cuts real video with ffprobe and ffmpeg.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Report real-data tests that CI cannot run
        run: |
          python -m pytest --collect-only -q --ignore=tmp -p no:cacheprovider -m requires_private_export | tee "$RUNNER_TEMP/private-export-tests.txt"
          echo "::warning title=Real-data tests not run::$(grep -c '::' "$RUNNER_TEMP/private-export-tests.txt") Python tests marked requires_private_export were NOT run. They need the private Strava export (DieselDiaries/activities.csv), which is not in the repository. Their status is blocked, not passed; run them locally with the export present."
          echo "### Real-data Python tests were NOT run" >> "$GITHUB_STEP_SUMMARY"
          echo "They need the private Strava export (DieselDiaries/activities.csv), which is not in the repository. Status: blocked, not passed." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '::' "$RUNNER_TEMP/private-export-tests.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Python tests (without the private export)
        run: python -m pytest -q --ignore=tmp -p no:cacheprovider -rs -m "not requires_private_export"

  javascript:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install application dependencies
        run: npm --prefix app ci

      - name: Typecheck
        run: npm --prefix app run typecheck

      - name: Unit tests
        run: npm --prefix app run test:unit

      # No Google Maps key exists here, so the build blanks it; nothing is deployed.
      - name: Production build
        run: npm --prefix app run build

      - name: Bundle budget
        run: npm --prefix app run test:bundle

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install application dependencies
        run: npm --prefix app ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      # Uses the Playwright version pinned in app/package-lock.json.
      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Report screenshot comparisons that CI cannot check
        run: |
          echo "::warning title=Screenshot comparisons not checked::Screenshot comparisons were NOT checked. The only reviewed baselines are macOS (-darwin.png), so app/playwright.config.ts sets ignoreSnapshots when CI is set. Compare them on macOS."
          echo "### Screenshot comparisons were NOT checked" >> "$GITHUB_STEP_SUMMARY"
          echo "Only macOS baselines exist (app/e2e/navigation.spec.ts-snapshots/*-darwin.png). The tests' other assertions ran." >> "$GITHUB_STEP_SUMMARY"

      # The config's web server builds with GODIESEL_DISABLE_LIVE_PROVIDERS=1.
      - name: Playwright suite
        working-directory: app
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e -- --trace off --reporter=list,html

      - name: Upload Playwright report and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore
          retention-days: 14
