name: Diagnose cinematic preview
on:
  push:
    branches: [codex/cinematic-world-replay]
    paths: [.github/workflows/diagnose-cinematic-preview.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: mkdir -p diagnosis
      - run: npm ci --prefix app
      - run: cd app && npx playwright install --with-deps chromium
      - name: Diagnose caught exceptions without replacing the live renderer
        working-directory: app
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const target = 'https://5eddc6ce.godiesel.pages.dev';
          const report = { target, sourceCommit: '93ff1706a79f49d43feb9c7d4c7543925d88cc75', browser: browser.version(), synthetic: false, debugging: true, errors: [], samples: [] };
          const clean = value => String(value).replace(/https?:\/\/[^\s)"']+/g, value => { try { const u = new URL(value); return u.origin + u.pathname; } catch { return '[url]'; } }).replace(/AIza[\w-]+/g, '[redacted]');
          try {
            const context = await browser.newContext({ viewport: { width: 1280, height: 720 }, serviceWorkers: 'block' });
            const page = await context.newPage();
            const cdp = await context.newCDPSession(page);
            await cdp.send('Debugger.enable');
            await cdp.send('Debugger.setPauseOnExceptions', { state: 'all' });
            cdp.on('Debugger.paused', event => {
              if (event.reason === 'exception' && report.errors.length < 30) report.errors.push(clean(event.data?.description || event.data?.value || 'exception'));
              void cdp.send('Debugger.resume').catch(() => {});
            });
            page.on('pageerror', error => report.errors.push(clean(error.message)));
            await page.goto(`${target}/#/replay/14130782031?renderer=cinematic`);
            for (let index = 0; index < 8; index++) {
              await page.waitForTimeout(5000);
              report.samples.push(await page.evaluate(() => ({ time: performance.now(), state: document.querySelector('[data-testid="replay-stage"]')?.getAttribute('data-state'), world: { ...document.querySelector('[data-world-terrain]')?.dataset } })));
              writeFileSync('../diagnosis/caught-errors.json', JSON.stringify(report, null, 2));
              if (index === 7) await page.screenshot({ path: '../diagnosis/live-final.png' });
            }
            await context.close();
          } finally { await browser.close(); writeFileSync('../diagnosis/caught-errors.json', JSON.stringify(report, null, 2)); }
          if (!report.samples.some(s => s.world?.worldTerrain === 'ready')) process.exitCode = 1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-preview-diagnosis
          path: diagnosis/
          retention-days: 3
