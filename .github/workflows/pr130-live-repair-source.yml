name: Validate live repair source
on:
  push:
    branches: [codex/pr130-refinement-inspection]
    paths: [.github/workflows/pr130-live-repair-source.yml]
permissions:
  contents: write
# This temporary job creates verified Git blobs only; it does not commit,
# update any ref, deploy or read deployment/provider secrets.
defaults:
  run:
    shell: bash
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 938449ac98cd01b5d6da4a68dc023e86f1baaba4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply exact locally verified source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/base.txt
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          request=urllib.request.Request('https://api.github.com/repos/the-prairie/goDiesel/git/blobs/4e81f4151a6a096d9284864f3cc41d42acf0e7fc',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request) as response:
            source=base64.b64decode(json.load(response)['content']).decode()
          source=source.replace("p.read_text()+'''\n\n", "p.read_text()+'''\n")
          exec(compile(source,'verified-source-preparation','exec'))
          PY
      - run: npm ci --prefix app
      - name: Typecheck and all unit tests
        working-directory: app
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee ../proof/typecheck.txt
          npm run test:unit 2>&1 | tee ../proof/unit.txt
      - name: Publish verified blobs without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          expected=json.loads(Path('proof/expected-blobs.json').read_text())
          entries=[]
          for path,sha in expected.items():
            data=Path(path).read_bytes()
            assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
            payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
            request=urllib.request.Request('https://api.github.com/repos/the-prairie/goDiesel/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request) as response:
              assert json.load(response)['sha']==sha
            entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          Path('proof/source-blobs.json').write_text(json.dumps(entries,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-repair-source
          path: proof/
          retention-days: 3
